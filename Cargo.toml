[package]
name = "hangul-setting"
version = "0.3.1"
edition = "2024"
description = "Kali Linux용 Rust 한글 입력기 (두벌식, GTK3·GTK4·Qt6·XIM)"
license = "MIT"
repository = "https://github.com/agnusdei1207/hangul-setting"

[workspace]
members = [".", "gtk4-im"]
# gtk4-im은 GTK4 개발 라이브러리가 있는 리눅스에서만 빌드한다(CI, Docker).
default-members = ["."]

[dependencies]
env_logger = { version = "0.11.11", default-features = false }
fontdue = "0.9.5"
futures-util = { version = "0.3.34", default-features = false }
log = "0.4.35"
x11rb = "0.14.0"
xim = { version = "0.6.0", default-features = false, features = ["std", "x11rb-server"] }
xim-ctext = "0.5.0"
zbus = "6.2.0"

[package.metadata.deb]
maintainer = "agnusdei1207 <agnusdei1207@gmail.com>"
section = "utils"
priority = "optional"
# $auto는 GTK4 모듈까지 훑어 libgtk-4-1을 필수로 만든다. 모듈은 이미 GTK4로 도는 앱 안에서만 읽히므로
# 바이너리가 쓰는 libc만 적는다.
depends = "libc6 (>= 2.34), fonts-nanum"
extended-description = "ibus·fcitx 없이 동작하는 Rust 한글 입력기(두벌식). 설치 후 재로그인하면 X11 세션의 GTK3·GTK4·Qt6 앱, Firefox, Chromium, xterm에서 한글을 입력할 수 있다. 한/영 전환 키는 ~/.config/hangul-setting/config에서 바꾼다. 무료 나눔 글꼴(OFL)을 함께 설치한다."
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/hangul-setting", "usr/bin/", "755"],
    ["target/release/libhangul_gtk4_im.so", "usr/lib/x86_64-linux-gnu/gtk-4.0/4.0.0/immodules/libim-hangul-setting.so", "644"],
    ["packaging/90hangul-setting", "etc/X11/Xsession.d/", "644"],
    ["packaging/hangul-setting.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/hangul-setting/README", "644"],
]
