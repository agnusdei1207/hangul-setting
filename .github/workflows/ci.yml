name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: GTK4 개발 라이브러리(입력 모듈 빌드), 나눔 글꼴(조합 창 테스트)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev fonts-nanum
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: e2e (Kali, Xvfb, xterm 조합 창, GTK3, Qt6, GTK4)
        run: |
          docker build -t hangul-e2e tests/e2e
          docker run --rm -v "$PWD:/src" hangul-e2e sh /src/tests/e2e/run.sh \
            /src/target/release/hangul-setting /src/target/release/libhangul_gtk4_im.so
