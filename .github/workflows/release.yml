name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 태그와 Cargo.toml 버전 일치
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "태그 $GITHUB_REF_NAME 와 Cargo.toml $version 가 다르다"; exit 1; }
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo install --locked cargo-deb@3.8.0
      - run: cargo deb --locked
      - name: e2e (설치한 .deb로 Kali, Xvfb, xterm, GTK3)
        run: |
          docker build -t hangul-e2e tests/e2e
          docker run --rm -v "$PWD:/src" hangul-e2e sh /src/tests/e2e/run.sh /src/target/debian/hangul-setting_*.deb
      - name: APT 저장소 게시 (gh-pages)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: sh packaging/apt/publish.sh target/debian/hangul-setting_*.deb
      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/debian/hangul-setting_*.deb --title "$GITHUB_REF_NAME" --generate-notes
